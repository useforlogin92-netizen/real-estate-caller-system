name: Static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required app files
        run: |
          set -eu
          for file in index.html app.js styles.css sw.js manifest.webmanifest icon.svg README_HI.md SECURITY_AUDIT.md; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js

      - name: Verify app shell references
        run: |
          grep -q 'href="./styles.css"' index.html
          grep -q 'src="./app.js"' index.html
          grep -q 'href="./manifest.webmanifest"' index.html
          grep -q "serviceWorker.register('./sw.js')" app.js
