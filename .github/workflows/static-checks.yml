name: Static checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required app files
        run: |
          set -eu
          for file in index.html app.js styles.css sw.js manifest.webmanifest icon.svg README_HI.md SECURITY_AUDIT.md ACCOUNT_MANAGEMENT_REQUIREMENTS.md LOGIN_APPROVAL_OTP_REQUIREMENTS.md WINDOWS_LAN_SERVER.md server/package.json server/server.js server/setup-admin.js server/smoke-test.js server/START-LAN-SERVER.bat; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check server/server.js
          node --check server/setup-admin.js
          node --check server/smoke-test.js

      - name: Verify app shell references
        run: |
          grep -q 'href="./styles.css"' index.html
          grep -q 'src="./app.js"' index.html
          grep -q 'href="./manifest.webmanifest"' index.html
          grep -q "serviceWorker.register('./sw.js')" app.js

      - name: Verify account management UI hooks
        run: |
          set -eu
          grep -q 'id="usersTab"' index.html
          grep -q 'id="userForm"' index.html
          grep -q 'id="userPassword"' index.html
          grep -q 'function readUsers' app.js
          grep -q 'function saveUser' app.js
          grep -q 'function toggleUser' app.js
          grep -q 'function editUser' app.js

      - name: Verify caller login approval and OTP options
        run: |
          set -eu
          grep -q 'id="loginMethod"' index.html
          grep -q 'value="otp"' index.html
          grep -q 'id="requestOtpBtn"' index.html
          grep -q 'id="userApproval"' index.html
          grep -q "user.approval!=='approved'" app.js
          grep -q 'function setUserApproval' app.js

      - name: Verify LAN API security and wiring
        run: |
          set -eu
          grep -q "scryptSync" server/server.js
          grep -q "request-otp" server/server.js
          grep -q "user.approval !== 'approved'" server/server.js
          grep -q "You may access only your assigned leads" server/server.js
          grep -q "LAN_MODE" app.js
          grep -q "includes('/api/')" sw.js

      - name: Run isolated LAN API integration smoke tests
        run: node server/smoke-test.js
